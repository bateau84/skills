name: Provider-free skill evaluations

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  harness:
    name: Validate fixtures and harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate evaluation fixtures
        run: python3 -I -B scripts/run_evals.py --validate
      - name: Fetch pinned evaluation runner
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/opencode-eval-runner"
          git init -q "$root"
          git -C "$root" remote add origin https://github.com/bateau84/opencode-eval-runner.git
          git -C "$root" fetch -q --depth 1 origin 4b0c28c1e8922a03dbd69ae0e42d2e5a0f00738d
          git -C "$root" checkout -q --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = 4b0c28c1e8922a03dbd69ae0e42d2e5a0f00738d
          printf 'SKILLS_EVAL_RUNNER_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Run provider-free harness tests
        run: python3 -I -B scripts/run_evals.py --harness-test
