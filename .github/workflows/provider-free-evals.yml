name: Provider-free skill evaluations

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  harness:
    name: Validate fixtures and harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate evaluation fixtures
        run: python3 -I -B scripts/run_evals.py --validate
      - name: Run provider-free harness tests
        run: python3 -I -B scripts/run_evals.py --harness-test
